name: Build Minecraft Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # This installs a clean, wrapper-free version of Gradle straight onto the server
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # Replaced './gradlew build' with the raw cloud 'gradle build' execution command
      - name: Build with Gradle
        run: gradle build

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SCP-Retro-Mod
          path: build/libs/*.jar
